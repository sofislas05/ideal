name: Run Selenium IDE tests on Chrome

on:
  pull_request:
    branches:
      - cardinal-quarter

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg unzip
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install selenium-side-runner
        run: npm install -g selenium-side-runner

      # --- Primer set de tests ---
      - name: Ensure Chrome/ChromeDriver are stopped and clean profile for dev-local tests
        run: |
          sudo pkill -9 chrome || true         # Mata cualquier proceso de Chrome de forma agresiva
          sudo pkill -9 chromedriver || true   # Mata cualquier proceso de ChromeDriver de forma agresiva
          rm -rf /tmp/selenium_profile_dev_local # Elimina el directorio de perfil

      - name: Run Selenium Tests for Ideal-tests-local.side
        run: |
          selenium-side-runner \
            -c '{"browserName":"chrome","goog:chromeOptions":{"args":["--headless","--disable-gpu","--no-sandbox","--user-data-dir=/tmp/selenium_profile_dev_local"]}}' \
            tests/dev-local/Ideal-tests-local.side

      # --- Segundo set de tests ---
      - name: Ensure Chrome/ChromeDriver are stopped and clean profile for prod tests
        run: |
          sudo pkill -9 chrome || true
          sudo pkill -9 chromedriver || true
          rm -rf /tmp/selenium_profile_prod

      - name: Run Selenium Tests for ideal-tests-prod.side
        run: |
          selenium-side-runner \
            -c '{"browserName":"chrome","goog:chromeOptions":{"args":["--headless","--disable-gpu","--no-sandbox","--user-data-dir=/tmp/selenium_profile_prod"]}}' \
            tests/prod/ideal-tests-prod.side