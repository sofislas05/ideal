name: Run Selenium IDE tests

on:
  pull_request:
    branches:
      - cardinal-quarter

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg unzip
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Selenium Side Runner
        run: |
          npm install -g selenium-side-runner

      - name: Run Selenium Tests (dev-local & prod)
        run: |
          selenium-side-runner \
            --capabilities browserName=chrome,goog:chromeOptions.args='["--headless","--disable-gpu","--no-sandbox"]' \
            tests/dev-local/Ideal-tests-local.side \
            tests/prod/ideal-tests-prod.side

