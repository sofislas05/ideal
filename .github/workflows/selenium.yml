name: Run Selenium IDE tests on Chrome

on:
  pull_request:
    branches:
      - cardinal-quarter

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg unzip
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install selenium-side-runner
        run: npm install -g selenium-side-runner

      - name: Clean up old Selenium profile directory
        run: |
          rm -rf /tmp/selenium_profile
        # Añadimos esta línea para asegurar que el directorio esté limpio antes de la ejecución

      - name: Run Selenium Tests on Chrome with clean profile
        run: |
          selenium-side-runner \
            -c '{"browserName":"chrome","goog:chromeOptions":{"args":["--headless","--disable-gpu","--no-sandbox","--user-data-dir=/tmp/selenium_profile"]}}' \
            tests/dev-local/Ideal-tests-local.side \
            tests/prod/ideal-tests-prod.side