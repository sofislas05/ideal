name: Run Selenium IDE tests on Firefox

on:
  pull_request:
    branches:
      - cardinal-quarter

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install selenium-side-runner
        run: npm install -g selenium-side-runner

      - name: Run Selenium Tests on Firefox
        run: |
          selenium-side-runner \
            -c '{"browserName":"firefox","moz:firefoxOptions":{"args":["-headless"]}}' \
            tests/dev-local/Ideal-tests-local.side \
            tests/prod/ideal-tests-prod.side
