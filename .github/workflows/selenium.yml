name: Robust Selenium IDE Tests with Docker Compose Astro App and Selenium Container

on:
  pull_request:
    branches:
      - cardinal-quarter

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    services:
      # --- SOLO el Contenedor de Selenium (Firefox) se define aquí ---
      selenium-firefox:
        image: selenium/standalone-firefox:4.17.0-20240124 # Versión específica y estable
        ports:
          - "4444:4444" # Puerto para el Selenium WebDriver
          - "7900:7900" # Opcional: Puerto VNC para ver la ejecución (comentar en producción)
        volumes:
          - /dev/shm:/dev/shm # Requiere /dev/shm para rendimiento de navegador
        options: --shm-size=2g # Aumenta el tamaño de memoria compartida para Firefox en Docker
        # Healthcheck para asegurar que Selenium Grid esté listo
        healthcheck:
          test: ["CMD-SHELL", "curl -f http://localhost:4444/wd/hub/status || exit 1"]
          interval: 5s
          timeout: 10s
          retries: 10

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      # --- Docker Compose para la aplicación Astro (AHORA SÓLO EN STEPS) ---
      - name: Bring up Astro App with Docker Compose
        run: |
          echo "Starting Astro application with Docker Compose..."
          # docker compose up -d construirá la imagen de Astro (si el docker-compose.yml lo especifica)
          # y levantará el contenedor Astro, con su mapeo de puertos 4000:4321.
          docker compose up -d

          echo "Waiting for Astro app to be healthy on localhost:4000 (mapped from container port 4321)..."
          for i in `seq 1 60`; do
            curl -s http://localhost:4000 > /dev/null && break
            echo "Astro app not ready yet, waiting 1 second..."
            sleep 1
          done
          echo "Astro app should be running now."

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install selenium-side-runner globally
        run: npm install -g selenium-side-runner

      # --- Ejecución de Tests de Selenium IDE ---
      # Tus tests de Selenium IDE (en los archivos .side) deben apuntar a http://localhost:4000
      - name: Run Selenium Tests for Ideal-tests-local.side
        run: |
          selenium-side-runner \
            --server http://localhost:4444/wd/hub \
            -c '{"browserName":"firefox"}' \
            tests/dev-local/Ideal-tests-local.side

      - name: Run Selenium Tests for ideal-tests-prod.side
        run: |
          selenium-side-runner \
            --server http://localhost:4444/wd/hub \
            -c '{"browserName":"firefox"}' \
            tests/prod/ideal-tests-prod.side