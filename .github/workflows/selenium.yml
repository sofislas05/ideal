name: Robust Selenium IDE Tests with Docker Compose Astro App and Selenium Container

on:
  pull_request:
    branches:
      - cardinal-quarter

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    services:
      selenium-firefox:
        # --- CAMBIO CLAVE AQUÍ: Usamos una versión específica y más reciente ---
        image: selenium/standalone-firefox:4.22.0 # O la última versión estable que encuentres en Docker Hub
        ports:
          - "4444:4444"
          - "7900:7900"
        volumes:
          - /dev/shm:/dev/shm
        options: --shm-size=2g

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Bring up Astro App with Docker Compose
        run: |
          docker compose up -d
          for i in `seq 1 60`; do
            curl -s http://localhost:4000 > /dev/null && break
            sleep 1
          done

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install selenium-side-runner globally
        run: npm install -g selenium-side-runner

      - name: Wait for Selenium Firefox service to be fully ready
        run: |
          echo "Waiting an additional 15 seconds for Selenium Firefox to stabilize..."
          sleep 15

      - name: Run Selenium Tests for Ideal-tests-local.side
        run: |
          selenium-side-runner \
            --server http://localhost:4444/wd/hub \
            -c '{"browserName":"firefox"}' \
            tests/dev-local/Ideal-tests-local.side

      - name: Run Selenium Tests for ideal-tests-prod.side
        run: |
          selenium-side-runner \
            --server http://localhost:4444/wd/hub \
            -c '{"browserName":"firefox"}' \
            tests/prod/ideal-tests-prod.side