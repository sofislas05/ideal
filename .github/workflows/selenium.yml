name: Basic Selenium IDE Tests with Dockerized Astro App

on:
  pull_request:
    branches:
      - cardinal-quarter # Se ejecuta en Pull Requests a la rama 'cardinal-quarter'.

jobs:
  selenium-tests:
    runs-on: ubuntu-latest # El sistema operativo del runner de GitHub Actions.

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Build Docker Image for Astro App
        run: docker build -t astro-app .

      - name: Run Docker Container for Astro App
        run: |
          # CAMBIO CRUCIAL AQUÍ: Mapeamos el puerto 4000 del host al 4321 del contenedor
          docker run -d -p 4000:4321 --name my-astro-app astro-app
          # Verificamos el puerto 4000 en el host, que es donde el runner se conectará
          for i in `seq 1 60`; do
            curl -s http://localhost:4000 > /dev/null && break
            sleep 1
          done

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Firefox Browser
        run: |
          sudo apt-get update -y
          sudo apt-get install -y firefox

      - name: Install selenium-side-runner globally
        run: npm install -g selenium-side-runner

      - name: Run Selenium Tests for Ideal-tests-local.side on Firefox
        run: |
          # Tus tests deben apuntar a http://localhost:4000
          selenium-side-runner \
            -c '{"browserName":"firefox","moz:firefoxOptions":{"args":["--headless"]}}' \
            tests/dev-local/Ideal-tests-local.side