name: Run UI Tests on Pull Request

on:
  pull_request:
    branches:
      - cardinal-quarter

jobs:
  test_ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install pnpm globally and project dependencies
        run: | # Usa | para multilínea en YAML
          npm install -g pnpm  # Instala pnpm globalmente
          pnpm install --frozen-lockfile # Luego, instala las dependencias del proyecto usando pnpm

      - name: Run Selenium IDE UI Tests
        run: pnpm run test:ui

      - name: Upload Test Results (Optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-results
          path: ./test-results