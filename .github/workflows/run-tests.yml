name: Run UI Tests on Pull Request

on:
  pull_request:
    branches:
      - cardinal-quarter

jobs:
  test_ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install project dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      # Set up a virtual display for Chrome
      - name: Set up virtual display
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      # Start the Astro development server
      - name: Start Astro development server
        run: |
          pnpm run dev &
          # Wait for the server to start
          echo "Waiting for server to start..."
          npx wait-on http://localhost:4321 -t 60000

      # Run tests with a unique user data directory
      - name: Run Selenium IDE UI Tests
        run: |
          mkdir -p /tmp/chrome-user-data
          CHROME_OPTIONS='browserName=chrome goog:chromeOptions.args=[--headless,--no-sandbox,--disable-dev-shm-usage,--disable-gpu,--user-data-dir=/tmp/chrome-user-data]'
          npx selenium-side-runner tests/dev-local/ideal-tests-local.side -c "$CHROME_OPTIONS"
